<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jade</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#04140f;color:#fff;font-family:"Geist",-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:22px 44px;border-radius:999px;font-size:clamp(22px,2.4vw,34px);letter-spacing:-.03em;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.07));-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(160,255,220,.25),inset 0 0 0 1px rgba(255,255,255,.14),0 30px 80px -30px rgba(0,40,25,.6);transition:transform .25s ease-out}
.hint{position:fixed;left:24px;bottom:20px;font-size:12px;color:rgba(255,255,255,.55);letter-spacing:.02em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="pill" id="pill">Jade Pro</div>
<div class="hint">Move the pointer to steer the sweep</div>
<script>
const cv=document.getElementById('c'),gl=cv.getContext('webgl',{antialias:false});
const FS=`precision highp float;uniform vec2 uRes,uPtr;uniform float uT;
float h(float n){return fract(sin(n*127.1)*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*vn(p);p=p*2.03+7.1;a*=.5;}return s*1.14;}
vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x-s*p.y,s*p.x+c*p.y);}
// a palette of jade: deep, mid, bright, mint, cream, teal, olive
vec3 pal(float k){
  if(k<.22)return vec3(.02,.24,.14);
  if(k<.36)return vec3(.06,.40,.25);
  if(k<.48)return vec3(.14,.58,.36);
  if(k<.58)return vec3(.50,.84,.64);
  if(k<.84)return vec3(.94,.98,.90);
  if(k<.93)return vec3(.14,.54,.56);
  return vec3(.62,.78,.30);}
// one depth layer of soft blades, each a long gaussian leaning with the sweep
vec4 layer(vec2 p,float t,float L,float seed,float size,float lean,float alpha){
  vec3 col=vec3(0.);float a=0.;
  for(int i=0;i<9;i++){float n=float(i)+seed;
    vec2 c=vec2((h(n*1.7)-.5)*1.9,(h(n*2.9)-.5)*1.1)+vec2(.09*sin(t*.7+n),.07*cos(t*.55+n*1.3));
    float ang=lean+(h(n*4.1)-.5)*.5+.12*sin(t*.4+n);
    vec2 s=vec2(size*(.5+h(n*5.3)),size*.28*(.6+h(n*6.7)));
    vec2 d=rot(p-c,-ang)/s;float g=exp(-dot(d,d));
    vec3 pc=pal(h(n*7.9));
    col+=pc*g;a+=g;}
  a=min(a,1.);return vec4(col/max(a*0.0+1.,1.)*0.0+col,a);}
vec3 scene(vec2 p,float t,float lean){
  // far light, teal into cream
  vec2 w=vec2(fbm(p*.8+vec2(t*.4,0.)),fbm(p*.8+vec2(3.,t*.35)))-.5;vec2 q=p+.2*w;
  vec3 c=mix(vec3(.14,.56,.58),vec3(.52,.80,.64),smoothstep(-.9,.9,q.x+.3*q.y));
  c=mix(c,vec3(.92,.98,.90),exp(-dot((q-vec2(-.35,-.55))*vec2(.8,1.6),(q-vec2(-.35,-.55))*vec2(.8,1.6))*1.6)*.85);
  // far, mid and near blades
  vec4 f=layer(q,t,.0,0.,.70,lean,.7);c=mix(c,f.rgb/max(f.a,.001),clamp(f.a*.95,0.,.9));
  vec4 m=layer(q+vec2(.03,0.),t*1.15,.0,40.,.42,lean+.05,.85);c=mix(c,m.rgb/max(m.a,.001),clamp(m.a*.8,0.,.9));
  vec4 n=layer(q-vec2(.05,.02),t*1.3,.0,90.,.62,lean-.04,.9);c=mix(c,n.rgb/max(n.a,.001)*.55,clamp(n.a*.8,0.,.85));
  // a few soft light spots
  for(int i=0;i<5;i++){float k=float(i)+200.;vec2 sp=vec2((h(k)-.5)*1.7,(h(k*1.3)-.5)*1.0)+vec2(.06*sin(t+k),.05*cos(t*.8+k));float r=.05+.06*h(k*2.);c+=vec3(.7,1.,.85)*exp(-dot(q-sp,q-sp)/(r*r))*.16;}
  return c;}
void main(){vec2 uv=gl_FragCoord.xy/uRes;float asp=uRes.x/uRes.y;vec2 p=(uv-.5)*vec2(asp,1.);
  float t=uT*.16;
  // the sweep: steered by the pointer, breathing on its own
  float lean=-.62+.18*sin(t*.5)+(uPtr.y-.5)*.5-(uPtr.x-.5)*.25;
  float len=.34+.08*sin(t*.8+1.)+.1*abs(uPtr.x-.5);
  vec2 dir=vec2(cos(lean),sin(lean));
  vec2 Z=vec2(.14*sin(t*.4),.07*cos(t*.33))+(uPtr-.5)*vec2(.2,-.1);
  vec3 acc=vec3(0.);float ws=0.;
  for(int i=0;i<12;i++){float k=float(i)/11.-.5;float w=exp(-k*k*5.5);
    vec2 q=p+dir*k*len;q=Z+(q-Z)*(1.+k*.14);
    // slight colour separation along the sweep, like a real lens
    vec3 s=vec3(scene(q+dir*.006,t,lean).r,scene(q,t,lean).g,scene(q-dir*.006,t,lean).b);
    acc+=s*w;ws+=w;}
  vec3 c=acc/ws;
  // fibres along the sweep
  vec2 fr=rot(p,-lean);
  float fib=fbm(vec2(fr.y*24.,fr.x*.8+t*.7)),fib2=vn(vec2(fr.y*70.,fr.x*.5-t));
  float fm=smoothstep(.2,.7,fbm(p*1.2+vec2(t*.5,2.)));
  c*=1.+(fib-.5)*.5*fm;c+=vec3(.65,.88,.6)*pow(fib2,7.)*.16*fm;
  // glow from the lower left, and a soft bloom on the brights
  c+=vec3(.7,1.,.85)*exp(-length(p-vec2(-.55,-.45))*1.5)*.3;
  float lum=dot(c,vec3(.3,.59,.11));c+=c*smoothstep(.6,1.,lum)*.25;
  c=mix(vec3(lum),c,.98);
  c*=1.-.45*smoothstep(.5,1.25,length(p*vec2(.75,1.)));
  c+=(h2(gl_FragCoord.xy+fract(uT)*91.)-.5)*.09;
  gl_FragColor=vec4(c,1.);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(pr,'uRes'),uT=gl.getUniformLocation(pr,'uT'),uP=gl.getUniformLocation(pr,'uPtr');
let sc=.7,px=.5,py=.5,tx=.5,ty=.5;
function fit(){cv.width=Math.round(innerWidth*sc*Math.min(devicePixelRatio||1,1.5));cv.height=Math.round(innerHeight*sc*Math.min(devicePixelRatio||1,1.5));gl.viewport(0,0,cv.width,cv.height)}
addEventListener('resize',fit);fit();
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth;ty=1-e.clientY/innerHeight;const pl=document.getElementById('pill');pl.style.transform='translate(calc(-50% + '+((tx-.5)*18)+'px),calc(-50% + '+((.5-ty)*14)+'px))'});
let last=performance.now(),T=0,ema=.016,nf=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;px+=(tx-px)*(1-Math.pow(.02,dt));py+=(ty-py)*(1-Math.pow(.02,dt));
  if(++nf>40){ema=ema*.9+dt*.1;if(ema>.026&&sc>.4){sc-=.1;fit();ema=.016;nf=0}}
  gl.uniform2f(uR,cv.width,cv.height);gl.uniform2f(uP,px,py);gl.uniform1f(uT,T);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
